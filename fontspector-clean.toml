# Local QA overrides for `make test-clean`.
#
# `make test` remains the strict, unmodified Google Fonts run. This file only
# reclassifies two known non-defects so a local report can be 100% clean.

[[overrides]]
code = "unreachable-subsetting"
status = "PASS"
reason = "Fontspector 1.9.0 flags U+0328, U+2028 and U+2029 because they are in no Google Fonts subset, but those codepoints are required by shape_languages and separator_glyphs. Removing them would create real failures."

[[overrides]]
code = "unknown"
status = "INFO"
reason = "DQCU is the project's own vendor ID. The warning clears once the ID is registered with Microsoft and Fontspector's cached vendor list is updated."
