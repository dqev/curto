# Google Fonts Builder configuration.
# Documentation: https://github.com/googlefonts/gftools/blob/main/Lib/gftools/builder/__init__.py

sources:
  - Curto.glyphs
  - Curto_Italic.glyphs

familyName: "Curto Serif"

# Default output locations: fonts/variable, fonts/ttf, fonts/otf, fonts/webfonts.
buildVariable: true
buildStatic: true
buildTTF: true
buildOTF: true
buildWebfont: true

# Let gftools repair metadata issues while building.
includeSourceFixes: true

# Use the same component handling as the Google Fonts build pipeline.
flattenComponents: true
decomposeTransformedComponents: true
checkCompatibility: true
overlaps: booleanOperations

stat:
  CurtoSerif[wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
  - name: Italic
    tag: ital
    values:
    - name: Roman
      value: 0
      linkedValue: 1
      flags: 2
  CurtoSerif-Italic[wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
  - name: Italic
    tag: ital
    values:
    - name: Italic
      value: 1
